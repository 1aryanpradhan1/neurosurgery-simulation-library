<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case simulation | Neurosurgical Simulation Library</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"><style>*{box-sizing:border-box}body{margin:0;background:#101b17;color:#e8efe9;font-family:'DM Sans',sans-serif}header{min-height:72px;background:#182720;border-bottom:1px solid #34463c;display:flex;align-items:center;justify-content:space-between;padding:16px 5%;gap:20px}nav{display:flex;gap:30px}nav a{font-size:13px;font-weight:600;text-decoration:none;color:#adbbaf}main{max-width:950px;margin:auto;padding:65px 5%}.eyebrow{color:#a8c8ad;font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;margin-top:48px}h1{font:normal 40px/1.18 Calibri, Carlito, Arial, sans-serif;max-width:850px}p{line-height:1.7;color:#bac9bc}.notice{margin:35px 0;background:#182720;border:1px solid #425849;padding:28px}.notice h2{font:normal 24px Calibri, Carlito, Arial, sans-serif;margin-top:0}.action{display:inline-block;color:#bedcc3;text-decoration:none;margin-top:14px}.issue{font-size:12px;color:#a8c8ad}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}nav{gap:18px;flex-wrap:wrap}h1{font-size:30px}}</style><link rel="stylesheet" href="assets/library-brand.css"><link rel="stylesheet" href="assets/case-back.css"><script defer src="assets/case-back.js"></script></head><body><header><div class="case-header-heading"><a class="case-back" href="cases.html" data-case-back>← Back</a><a class="library-brand" href="index.html">Neurosurgical Simulation Library</a></div><nav><a href="index.html">Home</a><a href="procedures.html">Procedure Library</a><a href="cases.html">Operative Cases</a></nav></header><main><div class="eyebrow">Case simulation</div><h1 id="title">Case Not Found</h1><div class="issue" id="meta"></div><div class="notice"><h2>Simulation Coming Soon</h2><p>This case is planned for a dedicated simulation. The simulation has not been built yet.</p><a class="action" id="article" target="_blank" rel="noopener noreferrer" hidden>View publication ↗</a></div></main>
<script src="assets/case-articles.js"></script>
<script>
const id = new URLSearchParams(location.search).get('case');
const article = articles.find(entry => entry.pmid === id);
if (article?.simulation) {
    const simulation = new URL(article.simulation, location.href);
    const from = new URLSearchParams(location.search).get('from');
    simulation.searchParams.set('from', from === 'home' ? 'home' : 'cases');
    location.replace(simulation);
} else if (article) {
    document.querySelector('#title').textContent = article.title;
    document.querySelector('#meta').textContent = (article.publicationDate || article.issue) + ' · ' + article.specialty;
    const link = document.querySelector('#article');
    link.href = 'https://pubmed.ncbi.nlm.nih.gov/' + article.pmid + '/';
    link.hidden = false;
}
</script></body></html>
