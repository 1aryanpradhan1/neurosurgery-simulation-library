</head><body data-page="procedures"><header><a class="site-title" href="index.html">Neurosurgical Simulation Library</a><nav><a href="index.html">Home</a><a href="procedures.html">Procedure library</a><a href="cases.html">Operative cases</a></nav></header><main class="shell"><div class="section-head" id="library"><div><div class="eyebrow">Browse by specialty</div><h2>The procedure library</h2></div></div><div class="library-layout"><aside class="side" id="filters"></aside><div class="main"><div class="bar"><h3 id="heading">All procedures</h3><input class="search" id="search" type="search" placeholder="Search procedures, anatomy, or variants..." aria-label="Search procedures"></div><div class="results" id="count"></div><div id="list"></div></div></div></main><footer class="footer">Neurosurgical simulation library &nbsp; · &nbsp; Prototype</footer><dialog id="modal"><div class="modal"><button class="close" onclick="modal.close()" aria-label="Close">×</button><div class="eyebrow" id="modal-group"></div><h2 id="modal-title"></h2><p id="modal-description"></p><div id="modal-options"></div><div id="modal-action"></div></div></dialog><script>

osterior fixation","Ventral craniocervical decompression and odontoid fixation","ACDF","Anterior cervical corpectomy","Cervical disc arthroplasty and hybrid reconstruction","Posterior cervical decompression and fusion","Posterior cervical foraminotomy","Thoracic discectomy and corpectomy","Lumbar discectomy","Lumbar stenosis decompression","Posterior lumbar fusion","ALIF and anterior lumbar replacement","Lateral lumbar interbody fusion","Oblique lumbar interbody fusion","Deformity correction and osteotomy","Spine trauma reduction and stabilization","Vertebral augmentation","Extradural and vertebral tumor surgery","Intradural extramedullary tumor surgery","Intramedullary tumor surgery","Spinal vascular and non-neoplastic intradural surgery","Spinal infection and postoperative revision"],"Functional, epilepsy and pain":["DBS","Stereotactic lesioning","Invasive epilepsy monitoring","Temporal epilepsy surgery","Extratemporal epilepsy surgery","Hemispheric disconnection and corpus callosotomy","Hypothalamic hamartoma surgery and epilepsy ablation","Epilepsy neuromodulation","Cranial nerve microvascular decompression","Percutaneous trigeminal procedures","Spasticity surgery","Spinal and peripheral stimulation","Intrathecal pump surgery","Ablative pain surgery"],"Peripheral nerve":["Upper-extremity entrapment release","Lower-extremity and truncal entrapment release","Brachial plexus reconstruction and thoracic outlet","Peripheral nerve repair and transfer","Peripheral nerve tumors and biopsy","Neuroma and amputation-related nerve surgery"],"Pediatric-specific":["Craniosynostosis and cranial vault reconstruction","Neural tube defect and encephalocele closure","Fetal myelomeningocele repair","Spinal dysraphism and untethering","Pediatric spine deformity"],"Radiosurgery":["Cranial stereotactic radiosurgery","Spine stereotactic radiation"]}
;let selected='All procedures', expanded=false;const list=document.querySelector('#list'),filters=document.querySelector('#filters'),search=document.querySelector('#search'),modal=document.querySelector('#modal');const live=n=>n==='Pterional'||n==='ACDF';const label=n=>n==='Pterional'?'Pterional craniotomy':n==='ACDF'?'Anterior cervical discectomy and fusion (ACDF)':n;function draw(){filters.innerHTML='<p class="eyebrow">Specialties</p>'+['All procedures',...Object.keys(groups)].map(g=>'<button class="filter '+(selected===g?'active':'')+'" data-group="'+g+'">'+g+' <span>'+(g==='All procedures'?101:groups[g].length)+'</span></button>').join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.group;expanded=false;draw()});let q=search.value.toLowerCase().trim(),items=Object.entries(groups).flatMap(([g,a])=>a.map(n=>({g,n}))).filter(x=>(selected==='All procedures'||selected===x.g)&&(label(x.n)+' '+x.g+(x.n==='Pterional'?' clinoidectomy orbitozygomatic sylvian':'')+(x.n==='ACDF'?' cervical fusion cage plated zero profile':'')).toLowerCase().includes(q));document.querySelector('#heading').textContent=selected;document.querySelector('#count').textContent=items.length+' procedures';const shown=expanded?items:items.slice(0,6);list.innerHTML=shown.map(x=>'<button type="button" class="row" data-name="'+x.n+'"><span><strong>'+label(x.n)+'</strong><small>'+x.g+'</small></span><span class="pill '+(live(x.n)?'live':'')+'">'+(live(x.n)?'Available':'Coming soon')+' &nbsp; ↗</span></button>').join('')||'<p class="results">No procedures match your search.</p>';if(items.length>6){const more=document.createElement('button');more.className='show-more';more.textContent=document.body.dataset.page==='procedures'?(expanded?'Show less':'Show all '+items.length+' procedures'):'Show all procedures ↗';more.onclick=()=>{if(document.body.dataset.page==='procedures'){expanded=!expanded;draw()}else location.href='procedures.html'};list.append(more)}list.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>openDetail(b.dataset.name))}search.oninput=()=>{expanded=false;draw()};function choice(title,items){return '<div class="eyebrow">'+title+'</div><div class="options">'+items.map((n,i)=>'<button class="opt '+(!i?'selected':'')+'" onclick="this.parentNode.querySelectorAll(\'.opt\').forEach(x=>x.classList.remove(\'selected\'));this.classList.add(\'selected\')">'+n+'</button>').join('')+'</div>'}function openDetail(name){const category=Object.keys(groups).find(g=>groups[g].includes(name))||'';document.querySelector('#modal-group').textContent=category;document.querySelector('#modal-title').textContent=label(name);document.querySelector('#modal-description').textContent=live(name)?'Choose a starting configuration, then open the interactive guide. The guide contains the complete variant controls.':'Explore the planned procedure and select a starting variant.';document.querySelector('#modal-options').innerHTML=name==='ACDF'?choice('Levels',['1 level','2 levels','3 levels'])+choice('Fixation',['Anterior plate','Zero-profile cage']):name==='Pterional'?choice('Clinoidectomy',['None','Extradural','Intradural'])+choice('Muscle approach',['Subfascial','Muscle-splitting'])+choice('Sylvian fissure',['Split','No split']):choice('Approach',['Standard','Alternative']);document.querySelector('#modal-action').innerHTML=live(name)?'<a class="launch" href="'+(name==='ACDF'?'acdf-guide.html':'pterional-guide.html')+'" target="_blank" rel="noopener noreferrer">Open simulation ↗</a><p class="note">Your selected options will open in the guide.</p>':'<div class="launch muted-button">Simulation coming soon</div>';if(live(name)){const launch=document.querySelector('#modal-action a');launch.onclick=()=>{const v=[...document.querySelectorAll('#modal-options .options')].map(e=>[...e.children].findIndex(x=>x.classList.contains('selected')));const q=name==='ACDF'?{levels:['1','2','3'][v[0]],construct:['plated','zero'][v[1]]}:{clinoid:['none','extra','intra'][v[0]],muscle:['subfascial','split'][v[1]],fissure:['yes','no'][v[2]]};launch.href=(name==='ACDF'?'acdf-guide.html':'pterional-guide.html')+'?'+new URLSearchParams(q)}}modal.showModal()}draw();
